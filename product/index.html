<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Product | Notorious Lamps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View handmade bottle lamps from Notorious Lamps.">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/product.css">
</head>
<body>

  <div id="siteHeader"></div>

  <main class="product-container">
    <section class="product-gallery">
      <div class="thumbnail-column" id="thumbnails"></div>

      <div class="main-image">
        <img
          id="mainImage"
          src="/assets/placeholder.jpg"
          alt="Product image">
      </div>
    </section>

    <section class="product-details">
      <h1 id="productTitle">Loading...</h1>
      <p class="price" id="productPrice"></p>
      <p class="description" id="productDescription"></p>
      <p id="stockStatus"></p>

      <div class="shade-selector" id="shadeSelector" style="display:none;">
        <h2>Choose your shade</h2>

        <div class="shade-carousel">
          <button type="button" class="shade-arrow" id="shadePrev">‹</button>

          <div id="shadeOptions"></div>

          <button type="button" class="shade-arrow" id="shadeNext">›</button>
        </div>
      </div>

      <button id="addToCartBtn" class="add-to-cart">
        Add to Cart
      </button>
      <div class="product-trust">
      <p>✓ Handmade in Scotland</p>
      <p>✓ One-of-a-kind design</p>
      <p>✓ Secure checkout powered by Stripe</p>
      <p>✓ Carefully packaged for safe delivery</p>
</div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="/js/product.js"></script>
  <script type="module" src="/js/cart-count.js"></script>
  <script type="module" src="/js/mini-cart.js"></script>
  <script type="module" src="/js/layout.js"></script>

</body>
</html>
