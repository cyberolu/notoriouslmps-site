<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Manage Products | Notorious Lamps Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body style="display:none;">

  <div id="adminHeader"></div>

  <main class="admin-container">
    <section class="admin-section">
      <h2 id="formTitle">Add Lamp</h2>

      <form id="productForm">
        <input type="hidden" name="productId">
        <input type="hidden" name="existingImages">
        <input type="hidden" name="existingShadeOptions">

        <label>
          Lamp title
          <input type="text" name="title" required>
        </label>

        <label>
          Base price without shade (£)
          <input type="number" name="price" step="0.01" min="0" required>
        </label>

        <label>
          Stock available
          <input type="number" name="stock" min="0" required>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" name="allowNoShade" checked>
          Lamp can be bought without a shade
        </label>

        <label>
          Main lamp images
          <input type="file" name="imageFiles" accept="image/*" multiple>
        </label>

        <p class="form-hint">
          Upload the lamp without a shade and any general product images.
        </p>

        <label>
          Description
          <textarea name="description" rows="4" required></textarea>
        </label>

        <section class="shade-options-admin">
          <div class="shade-options-header">
            <h3>Shade Options</h3>
            <button type="button" id="addShadeBtn">+ Add Shade</button>
          </div>

          <p class="form-hint">
            Add each shade option with its extra price and image of this lamp fitted with that shade.
          </p>

          <div id="shadeOptionsList"></div>
        </section>

        <label class="checkbox-label">
          <input type="checkbox" name="featured">
          Featured on homepage
        </label>

        <div class="form-actions">
          <button type="submit" id="submitBtn">Add lamp</button>
          <button type="button" id="cancelEditBtn" style="display:none;">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="admin-section">
      <h2>Existing lamps</h2>
      <div id="productList"></div>
    </section>
  </main>

  <script type="module" src="/js/admin.js"></script>
  <script type="module" src="/js/admin-layout.js"></script>

</body>
</html>
