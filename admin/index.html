<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Notorious Lamps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body style="display:none;">

  <div id="adminHeader"></div>

  <main class="admin-dashboard">

    <section class="admin-stats">
      <div class="admin-stat-card">
        <h2 id="productCount">0</h2>
        <p>Products</p>
      </div>

      <div class="admin-stat-card">
        <h2 id="orderCount">0</h2>
        <p>Orders</p>
      </div>

      <div class="admin-stat-card">
        <h2 id="customerCount">0</h2>
        <p>Customers</p>
      </div>

      <div class="admin-stat-card">
        <h2 id="revenueTotal">£0.00</h2>
        <p>Revenue</p>
      </div>
    </section>

    <section class="admin-menu">
      <a href="/admin/products/" class="admin-menu-card">
        <h2>Products</h2>
        <p>Add and manage lamps.</p>
      </a>

      <a href="/admin/orders/" class="admin-menu-card">
        <h2>Orders</h2>
        <p>Manage customer orders.</p>
      </a>

      <a href="/admin/customers/" class="admin-menu-card">
        <h2>Customers</h2>
        <p>View customer accounts.</p>
      </a>

      <a href="/admin/settings/" class="admin-menu-card">
        <h2>Settings</h2>
        <p>Store settings.</p>
      </a>
    </section>

  </main>

  <script type="module" src="/js/admin-dashboard.js"></script>
  <script type="module" src="/js/admin-layout.js"></script>
</body>
</html>
