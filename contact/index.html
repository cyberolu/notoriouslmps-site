<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Contact | Notorious Lamps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Notorious Lamps for questions, commissions and handmade bottle lamp enquiries.">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/contact.css">
</head>
<body>

  <div id="siteHeader"></div>

  <section class="contact-hero">
    <h1>Get in Touch</h1>
    <p>Questions, commissions, or just want to say hello?</p>
  </section>

  <main class="contact-container">
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/contact/thank-you/"
      class="contact-form"
    >
      <input type="hidden" name="form-name" value="contact">

      <p class="hidden">
        <label>
          Do not fill this out:
          <input name="bot-field">
        </label>
      </p>

      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>

      <button type="submit">Send Message</button>
    </form>
    <section class="custom-enquiry">
      <h2>Need a bespoke lamp?</h2>
      <p>
        If you're looking for a custom bottle lamp or have a special idea in mind,
        we'd love to hear from you. Use the form above and we'll get back to you
        as soon as possible.
      </p>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="/js/cart-count.js"></script>
  <script type="module" src="/js/mini-cart.js"></script>
  <script type="module" src="/js/layout.js"></script>

</body>
</html>
