<!DOCTYPE html>
<html lang="en-GB">
<head>

    <meta charset="UTF-8">

    <title>Create Account | Notorious Lamps</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">

</head>

<body>

<div id="siteHeader"></div>

<main class="auth-container">

    <form id="registerForm" class="auth-form">

        <img
            src="/assets/logo.png"
            alt="Notorious Lamps"
            class="auth-logo">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join the Notorious Lamps community
        </p>

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            required>

        <label>Email</label>

        <input
            type="email"
            name="email"
            required>

        <label>Password</label>

        <input
            type="password"
            name="password"
            minlength="6"
            required>

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirmPassword"
            minlength="6"
            required>

        <button type="submit">
            Create Account
        </button>

        <button
            type="button"
            id="googleRegister"
            class="google-btn">

            <img
                src="/assets/google.png"
                alt="Google">

            Continue with Google

        </button>

        <p class="auth-footer">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </p>

    </form>

</main>

<script type="module">

import {
    register,
    loginWithGoogle,
} from "/js/auth.js";

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    if (form.password.value !== form.confirmPassword.value) {
        alert("Passwords do not match.");
        return;
    }

    try {

        await register(
            form.name.value.trim(),
            form.email.value.trim(),
            form.password.value
        );

        window.location.href = "/account/";
    } catch (err) {
        alert(err.message);
    }

});

document
.getElementById("googleRegister")
.addEventListener("click", async () => {

    try {

        await loginWithGoogle();

        window.location.href = "/account/"; 

    } catch (err) {
        alert(err.message);
    }

});

</script>
<div id="siteFooter"></div>

<script type="module" src="/js/cart-count.js"></script>
<script type="module" src="/js/mini-cart.js"></script>
<script type="module" src="/js/layout.js"></script>

</body>
</html>
