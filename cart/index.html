<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta charset="UTF-8">

  <title>Shopping Cart | Notorious Lamps</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Review your shopping cart before securely checking out with Stripe.">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/cart.css">

</head>

<body>

<div id="siteHeader"></div>

<main class="cart-container">

  <h1 id="cartHeading">Your Cart</h1>

  <div id="cartItems"></div>

  <div class="cart-summary">

  <div class="cart-summary-row">
    <span>Subtotal</span>

    <strong>
      £<span id="cartSubtotal">0.00</span>
    </strong>
  </div>

  <div class="cart-summary-row">
    <span>UK delivery</span>

    <strong>
      £<span id="shippingTotal">0.00</span>
    </strong>
  </div>

  <div class="cart-summary-row cart-summary-total">
    <span>Total</span>

    <strong>
      £<span id="cartTotal">0.00</span>
    </strong>
  </div>

  <p class="shipping-notice">
    Delivery is available to UK addresses only.
  </p>

  <button id="checkoutBtn" disabled>
    Proceed to Secure Checkout
  </button>

    <p
      id="emptyNotice"
      style="margin-top:1rem;opacity:.7;">

      Your cart is currently empty.

    </p>

  </div>

</main>

<div id="siteFooter"></div>

<script type="module" src="/js/cart.js"></script>
<script type="module" src="/js/cart-count.js"></script>
<script type="module" src="/js/mini-cart.js"></script>
<script type="module" src="/js/layout.js"></script>

</body>
</html>
